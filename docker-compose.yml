# Ganze Anwendung starten:          docker compose up -d --build    ->  http://localhost:3000
# Mit HTTPS (Schulserver):          docker compose --profile https up -d --build
# Nur die Datenbank (Entwicklung):  docker compose up -d db
# Werte kommen aus der Datei .env (Vorlage: .env.example). Anleitung für den Schulserver: docs/installation.md
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schulinventar}
      POSTGRES_USER: ${POSTGRES_USER:-schulinventar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Nur für die lokale Entwicklung vom eigenen Laptop aus. Im Echtbetrieb entfernen.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-schulinventar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-schulinventar}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET in .env setzen}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOAD_DIR: /data/uploads
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-10}
      AUFBEWAHRUNG_JAHRE: ${AUFBEWAHRUNG_JAHRE:-7}
    ports:
      - '3000:3000'
    volumes:
      # Hochgeladene Belege. Liegen in einem eigenen Speicher, damit sie beim Neubau des Containers erhalten bleiben.
      - uploads:/data/uploads

  # Tägliche Sicherung von Datenbank und Belegen in den Ordner ./sicherungen (Script: sicherung/sichern.sh)
  sicherung:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-schulinventar}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-schulinventar}
      SICHERUNG_TAGE: ${SICHERUNG_TAGE:-30}
      TZ: Europe/Vienna
    volumes:
      - ./sicherung/sichern.sh:/sichern.sh:ro
      - ./sicherungen:/sicherungen
      - uploads:/data/uploads:ro
    entrypoint: ['sh', '/sichern.sh']

  # HTTPS für den Echtbetrieb (Pflichtenheft Kap. 5). Startet nur mit „--profile https“, Einstellungen im Caddyfile.
  https:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-daten:/data

volumes:
  db-data:
  uploads:
  caddy-daten:
